[project]
name = "pufre"
version = "0.1.0"
description = "Testing PUF Error Independence Beyond Marginal Reliability"
readme = "README.md"
authors = [
    { name = "Sergio Vinagrero", email = "servinagrero@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "h5py>=3.16.0",
    "matplotlib>=3.10.8",
    "networkx>=3.6.1",
    "numpy>=2.4.4",
    "polars>=1.39.3",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "tqdm>=4.67.3",
]

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mkdocstrings-python>=2.0.9",
    "mkdocstrings[python]>=1.0.6",
    "ruff>=0.17.1",
    "ty>=0.0.90",
    "zensical>=0.0.66",
]
